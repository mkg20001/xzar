[package]
name = "xzar-server"
version = "0.1.0"
edition = "2021"
description = "A pinning-based Nix cache server"
license = "MIT"

[lib]
name = "xzar_server"
path = "src/lib.rs"

[[bin]]
name = "xzar-server"
path = "src/main.rs"

[features]
default = []
test_harness = ["dep:tempfile"]
embed-ui = ["dep:rust-embed"]

[dependencies]
# Common types
xzar-common = { path = "../common" }

# Web framework
rocket = { version = "0.5", features = ["json"] }
rocket_cors = "0.6"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Database
diesel = { version = "2.2", features = ["postgres", "r2d2", "chrono"] }
diesel_migrations = "2.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"

# Encoding
base64 = "0.22"
data-encoding = "2"

# Logging & monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sentry = { version = "0.35", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing"] }
sentry-tracing = "0.35"

# Error handling
thiserror = "2"
anyhow = "1"

# Environment
dotenvy = "0.15"

# Multipart form parsing
multer = "3"

# Async utilities
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
bytes = "1"

# Test harness (optional)
tempfile = { version = "3", optional = true }

# UI embedding (optional)
rust-embed = { version = "8", optional = true, features = ["interpolate-folder-path"] }

[dev-dependencies]
tempfile = "3"
