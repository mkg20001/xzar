[package]
name = "xzar-interop"
version = "0.1.0"
edition = "2021"
description = "Integration and interoperability tests for xzar"
license = "MIT"
publish = false

# This is a test-only crate
[[test]]
name = "server"
path = "tests/server.rs"

[[test]]
name = "client"
path = "tests/client.rs"

[dependencies]
# Server library for test harness
xzar-server = { path = "../server", features = ["test_harness"] }

# Testing utilities
tokio = { version = "1", features = ["full", "process"] }
rocket = { version = "0.5", features = ["json"] }
serde_json = "1"
tempfile = "3"
rand = "0.8"
base64 = "0.22"

# HTTP client for health checks
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# For spawning client process
assert_cmd = "2"
predicates = "3"

# For generating public keys
ed25519-dalek = "2"

# For database access in GC tests
diesel = { version = "2", features = ["postgres", "chrono"] }
chrono = "0.4"
