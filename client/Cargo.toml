[package]
name = "xzar"
version = "0.1.0"
edition = "2021"
description = "CLI client for xzar Nix binary cache"
license = "MPL-2.0"

[[bin]]
name = "xzar"
path = "src/main.rs"

[dependencies]
# Common types
xzar-common = { path = "../common" }

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }

# Async runtime
tokio = { version = "1", features = ["full", "process"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Async utilities
futures = "0.3"
tokio-util = { version = "0.7", features = ["io", "compat"] }
async-compression = { version = "0.4", features = ["tokio", "xz"] }

# Progress bar
indicatif = "0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
num_cpus = "1"
humansize = "2"
libc = "0.2"
chrono = "0.4"

# Config file
dirs = "6"
toml = "0.8"
